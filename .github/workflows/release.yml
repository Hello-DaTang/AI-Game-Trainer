name: Build Windows portable Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "launcher.py"
      - "packaging/**"
      - "trainer/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "launcher.py"
      - "packaging/**"
      - "trainer/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-release
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0 -r requirements-windows.txt

      - name: Test Python source
        run: |
          python -m compileall -q trainer launcher.py
          python -m unittest discover -s tests -v

      - name: Freeze standalone application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name AI-Game-Trainer --add-data "trainer/static;trainer/static" --hidden-import win32file --hidden-import pywintypes --hidden-import win32timezone launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist\AI-Game-Trainer\AI-Game-Trainer.exe")) { throw "Missing exe" }

      - name: Bundle pinned MIT-licensed CE Lua Bridge
        run: |
          $checkout = Join-Path $env:RUNNER_TEMP "cheatengine-mcp-bridge"
          $revision = "6bd7ce90479250a9b4b75e7944df9c105ecb2572"
          git clone --quiet https://github.com/miscusi-peek/cheatengine-mcp-bridge.git $checkout
          if ($LASTEXITCODE -ne 0) { throw "Upstream git clone failed" }
          git -C $checkout checkout --quiet --detach $revision
          if ($LASTEXITCODE -ne 0) { throw "Upstream pinned checkout failed" }
          $resolved = (git -C $checkout rev-parse HEAD).Trim()
          if ($resolved -ne $revision) { throw "Upstream revision mismatch" }
          $target = "dist\AI-Game-Trainer\CE-Bridge"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$checkout\MCP_Server\ce_mcp_bridge.lua" "$target\ce_mcp_bridge.lua"
          Copy-Item "$checkout\LICENSE" "$target\LICENSE.txt"
          Copy-Item "packaging\README-PORTABLE.md" "dist\AI-Game-Trainer\使用说明.md"
          Copy-Item "LICENSE-THIRD-PARTY.txt" "dist\AI-Game-Trainer\第三方说明.txt"
          if (-not (Test-Path "$target\ce_mcp_bridge.lua")) { throw "Missing CE bridge" }

      - name: Smoke test standalone EXE
        run: |
          $exe = (Resolve-Path "dist\AI-Game-Trainer\AI-Game-Trainer.exe").Path
          $output = Join-Path $env:RUNNER_TEMP "trainer-stdout.log"
          $errors = Join-Path $env:RUNNER_TEMP "trainer-stderr.log"
          $port = 18765
          $process = Start-Process -FilePath $exe -ArgumentList "--no-browser --port $port" -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors
          try {
            $ok = $false
            for ($i=0; $i -lt 35; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              if ($process.HasExited) { break }
              Start-Sleep -Milliseconds 750
            }
            if (-not $ok) {
              if (Test-Path $output) { Get-Content $output }
              if (Test-Path $errors) { Get-Content $errors }
              throw "EXE standalone HTTP smoke test failed"
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5
            if ($page.Content -notmatch "AI Game Trainer") { throw "Dashboard missing" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Archive and checksum
        id: package
        run: |
          $version = (Get-Content "packaging\VERSION" -Raw).Trim()
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid VERSION" }
          $zip = "dist\AI-Game-Trainer-Windows-x64.zip"
          Compress-Archive -Path "dist\AI-Game-Trainer" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "ZIP not created" }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  AI-Game-Trainer-Windows-x64.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          "release_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Archive: $zip"
          Write-Host "SHA256: $hash"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-Trainer-Windows-x64
          path: |
            dist/AI-Game-Trainer-Windows-x64.zip
            dist/AI-Game-Trainer-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.package.outputs.release_version }}
        run: |
          gh release view "$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_VERSION already exists; increment packaging/VERSION to publish a new release"
          }
          gh release create "$env:RELEASE_VERSION" "dist\AI-Game-Trainer-Windows-x64.zip" "dist\AI-Game-Trainer-Windows-x64.zip.sha256" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "AI Game Trainer $env:RELEASE_VERSION (Windows x64 portable)" --notes-file "packaging\RELEASE_NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
