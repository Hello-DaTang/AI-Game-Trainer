[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-game-trainer"
version = "0.1.0"
description = "Local-first reusable Cheat Engine trainer presets"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["trainer"]

[tool.setuptools.package-data]
trainer = ["static/*.html", "static/*.css", "static/*.js"]
